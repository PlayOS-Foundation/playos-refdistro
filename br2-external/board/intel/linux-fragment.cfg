# PlayOS Intel PC kernel fragment (Sprint 13 T2)
# Applied on top of the kernel x86_64 defconfig by
# BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES.
#
# Target: ASUS ZenBook UX530 (Kaby Lake, Intel HD Graphics 620,
# NVIDIA 940MX/GTX 950 dGPU present but must not bind a driver).

# ── GPU: Intel Gen 9.5 via i915 (XE is for Gen 12+ only) ─────────
CONFIG_DRM=y
CONFIG_DRM_I915=y
CONFIG_DRM_FBDEV_EMULATION=y

# ── EFI stub direct boot (kernel placed as EFI/BOOT/BOOTX64.EFI) ─
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_VARS=y

# ── Audio: HDA controller + Realtek codec on the ZenBook ─────────
CONFIG_SND=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_HDMI=y

# ── Power: Intel P-State + RAPL ──────────────────────────────────
CONFIG_X86_INTEL_PSTATE=y
CONFIG_POWERCAP=y
CONFIG_INTEL_RAPL=y

# ── Explicitly disable other GPU/power vendors ───────────────────
# CONFIG_DRM_AMDGPU is not set
# CONFIG_DRM_NOUVEAU is not set
# CONFIG_X86_AMD_PSTATE is not set

# ── USB networking (USB-C Ethernet dongles, Sprint 13 SSH) ────────
# The ZenBook UX530 has no built-in Ethernet; its USB-C dock/dongle
# enumerates as a USB network device. The stock x86_64_defconfig ships
# these drivers as modules, and with no module autoload hook the dongle
# gets no driver, no wired interface appears, and playos-ssh-bringup
# falls back to loopback-only Dropbear (unreachable from the LAN).
# Build the common chipsets in-kernel so a wired interface exists at boot.
CONFIG_USB_USBNET=y
CONFIG_USB_NET_AX8817X=y
CONFIG_USB_NET_AX88179_178A=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_CDC_EEM=y
CONFIG_USB_RTL8152=y
CONFIG_USB_NET_SMSC75XX=y
CONFIG_USB_NET_SMSC95XX=y
CONFIG_USB_NET_MCS7830=y

# ── Reboot/power-off: UX530UQ hangs in stop_other_cpus() ─────────
# Both shutdown and reboot hang (black screen, fans spinning, power LED on).
# Root cause: native_machine_shutdown() -> stop_other_cpus() spins forever
# waiting for a secondary CPU to reach HLT (neither the REBOOT_VECTOR IPI nor
# the NMI fallback is acknowledged on this Kaby Lake board). Verified live:
# writing 1 to /sys/kernel/reboot/force makes a normal reboot complete while
# the default path hangs. reboot=force skips stop_other_cpus() for both reboot
# and power-off (native_machine_power_off() calls machine_shutdown() too).
CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE="console=tty1 quiet loglevel=3 reboot=force"
