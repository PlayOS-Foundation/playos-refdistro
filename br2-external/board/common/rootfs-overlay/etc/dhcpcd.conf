# PlayOS dhcpcd configuration (Sprint 11.6)
#
# The buildroot sample enables "require dhcp_server_identifier" and "duid".
# Both are incompatible with QEMU's slirp DHCP server: slirp omits the DHCP
# Server Identifier option and does not handle DUID-based client IDs, so
# dhcpcd silently discards the offer and the guest never gets an IPv4 address.
#
# Use a conventional MAC-based client-id instead. It is accepted by slirp and
# by real wired DHCP servers alike, which keeps QEMU validation and Ally wired
# SSH both working.
hostname
clientid
persistent
vendorclassid

option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name

# Wired dock port: needs a lease so the device is reachable for development, but
# must never outrank Wi-Fi for the default route (see supervisor.c).
interface eth*
metric 2000
interface en*
metric 2000
