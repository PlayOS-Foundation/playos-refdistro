name: PlayOS QEMU Build and Boot

on:
  push:
    branches: [main]
    paths:
      - 'br2-external/**'
      - 'versions.lock'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/qemu-build.yml'
  pull_request:
    branches: [main]

jobs:
  build-and-boot:
    name: Build and boot-check PlayOS (QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify version pins
        run: |
          bash scripts/verify-versions.sh versions.lock

      - name: Setup host environment
        run: |
          bash scripts/setup-ubuntu.sh

      - name: Setup Buildroot
        run: |
          make setup

      - name: Cache Buildroot downloads (dl)
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: ${{ runner.os }}-buildroot-dl-${{ hashFiles('versions.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildroot-dl-

      - name: Cache QEMU host toolchain
        uses: actions/cache@v4
        with:
          path: output/qemu/host
          key: ${{ runner.os }}-host-qemu-${{ hashFiles('versions.lock') }}
          restore-keys: |
            ${{ runner.os }}-host-qemu-

      - name: Build QEMU image
        run: |
          make qemu-build

      - name: Boot-check in QEMU
        run: |
          bash scripts/qemu-boot-check.sh --timeout 60

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-log
          path: /tmp/playos-boot-*.log
          retention-days: 7
