# PlayOS Intel PC kernel fragment (Sprint 13 T2)
# Applied on top of the kernel x86_64 defconfig by
# BR2_LINUX_KERNEL_CONFIG_FRAGMENT_FILES.
#
# Target: ASUS ZenBook UX530 (Kaby Lake, Intel HD Graphics 620,
# NVIDIA 940MX/GTX 950 dGPU present but must not bind a driver).

# ── GPU: Intel Gen 9.5 via i915 (XE is for Gen 12+ only) ─────────
CONFIG_DRM=y
CONFIG_DRM_I915=y
CONFIG_DRM_FBDEV_EMULATION=y

# ── EFI stub direct boot (kernel placed as EFI/BOOT/BOOTX64.EFI) ─
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFI_VARS=y

# ── Audio: HDA controller + Realtek codec on the ZenBook ─────────
CONFIG_SND=y
CONFIG_SND_HDA_INTEL=y
CONFIG_SND_HDA_CODEC_REALTEK=y
CONFIG_SND_HDA_CODEC_HDMI=y

# ── Power: Intel P-State + RAPL ──────────────────────────────────
CONFIG_X86_INTEL_PSTATE=y
CONFIG_POWERCAP=y
CONFIG_INTEL_RAPL=y

# ── Explicitly disable other GPU/power vendors ───────────────────
# CONFIG_DRM_AMDGPU is not set
# CONFIG_DRM_NOUVEAU is not set
# CONFIG_X86_AMD_PSTATE is not set
