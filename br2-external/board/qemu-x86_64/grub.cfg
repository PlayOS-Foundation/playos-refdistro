# QEMU x86_64 GRUB configuration
# Boots the PlayOS kernel with embedded initramfs via UEFI

set default=0
set timeout=3

menuentry "PlayOS (QEMU dev)" {
    linux /boot/bzImage root=/dev/ram0 console=ttyS0,115200n8 earlyprintk=serial,ttyS0,115200n8
    initrd /boot/initramfs.cpio
}

menuentry "PlayOS (QEMU dev, verbose)" {
    linux /boot/bzImage root=/dev/ram0 console=ttyS0,115200n8 earlyprintk=serial,ttyS0,115200n8 loglevel=7 debug
    initrd /boot/initramfs.cpio
}
