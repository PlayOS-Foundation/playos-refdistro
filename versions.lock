# versions.lock — PlayOS component version pins
#
# ALL entries must be full commit SHAs or exact version tags.
# Never use branch names or 'latest'.
# Update via: scripts/update-versions.sh --component <name> --commit <sha>
#
# ── Buildroot ─────────────────────────────────────────────────────────────
# Pinned Buildroot snapshot. REQUIRED: this is the single source of truth for
# the toolchain, kernel headers, and all third-party package versions
# (wlroots, Mesa, gcc, musl, wayland, ...). A known-good master snapshot is
# pinned for now; migrate to an LTS release tag at the next release cycle.
BUILDROOT_COMMIT=d38b4915e9437c5492836914c0a0fff12b4f1031
BUILDROOT_SOURCE=https://git.buildroot.net/buildroot

# ── Linux kernel ──────────────────────────────────────────────────────────
# Pinned kernel version for reproducibility. Must match BR2_KERNEL_HEADERS_*
# in the defconfigs (6.12.103). SHA256 is the kernel.org tarball digest.
LINUX_VERSION=6.12.103
LINUX_SOURCE=https://cdn.kernel.org/pub/linux/kernel/v6.x/
LINUX_SHA256=f143aaade8877ba5616e788b4482576db28481bcf557ef537f4fcc3938fc3176

# ── PlayOS components ─────────────────────────────────────────────────────
PLAYOS_SPEC_COMMIT=15ea4cca1a83c7deb575af565e6ebe9792eac1ab  # docs(sprints): add Sprint 17 — touch input + on-screen keyboard
PLAYOS_PLATFORM_API_COMMIT=b652af7fa985cae327385958877b2b380c90f1ee  # Sprint 8: ALSA master volume/mute with cached mixer handle
PLAYOS_RUNTIME_COMMIT=d0dd25864beb75b3e884d31afdce689b64db415d  # Sprint 7: persistent shell async-event listener (H2)
PLAYOS_INIT_COMMIT=3f328876b32e4f07d90efb4dbc3b00d34b15fd34  # fix(tests): seeded game ID in IPC test fixture
PLAYOS_COMPOSITOR_COMMIT=d22cd642d18f5accec1616573e9a4654b86e6295  # Sprint 7: foreground state machine + per-client overlay resource resolution
PLAYOS_SHELL_COMMIT=517f6ff0607fb5af6057602bbefe3b7799251877  # feat(raylib): feed PlayOS controller input into raylib gamepad subsystem
PLAYOS_SAMPLES_COMMIT=6d9eca237e9788574ec1c7702c1cd3b6f31eee59  # feat(audio-module): port raylib audio_module_playing
PLAYOS_SAMPLES_SOURCE=https://github.com/PlayOS-Foundation/playos-samples

# ── Key dependencies ──────────────────────────────────────────────────────
# NOTE: wlroots, Mesa, wayland, libdrm, libinput, libxkbcommon, gcc, and musl
# are all versioned by the pinned BUILDROOT_COMMIT above (Buildroot ships them).
# The fields below are INFORMATIONAL — leave empty unless PlayOS overrides a
# Buildroot default with its own package/version.
WLROOTS_COMMIT=
WLROOTS_SOURCE=https://gitlab.freedesktop.org/wlroots/wlroots

# Raylib is vendored as committed files inside playos-shell (external/raylib),
# so PLAYOS_SHELL_COMMIT already pins it. Kept here for visibility.
RAYLIB_COMMIT=dbc56a87da87d973a9c5baa4e7438a9d20121d28  # 6.0 tag
RAYLIB_SOURCE=https://github.com/raysan5/raylib

MESA_VERSION=
MESA_SOURCE=https://mesa.freedesktop.org/archive/

WAYLAND_VERSION=
WAYLAND_PROTOCOLS_VERSION=
LIBDRM_VERSION=
LIBINPUT_VERSION=
LIBXKBCOMMON_VERSION=

# ── Toolchain ─────────────────────────────────────────────────────────────
# Toolchain versions are pinned transitively via BUILDROOT_COMMIT (informational):
TOOLCHAIN_MUSL_VERSION=
GCC_VERSION=
