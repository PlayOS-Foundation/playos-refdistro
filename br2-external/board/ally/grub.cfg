# ROG Ally GRUB configuration
# Boots the PlayOS kernel with embedded initramfs via UEFI

set default=0
set timeout=3

menuentry "PlayOS (ROG Ally)" {
    linux /boot/bzImage root=/dev/ram0 console=tty1 quiet loglevel=3
    initrd /boot/initramfs.cpio
}

menuentry "PlayOS (ROG Ally, verbose)" {
    linux /boot/bzImage root=/dev/ram0 console=tty1 loglevel=7 debug drm.debug=0xe
    initrd /boot/initramfs.cpio
}
