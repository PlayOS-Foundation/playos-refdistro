# PlayOS ALSA routing — point the default PCM/control interface at the
# internal-speaker codec (Realtek ALC294) instead of the GPU's HDMI audio.
#
# On the ROG Ally card 0 is the AMD GPU's HDMI/DP HDA controller and card 1
# is the ALC294 whose analog PCM (01-00: ALC294 Analog) drives the CS35L41
# internal speakers. ALSA's built-in `default` PCM resolves card 0 (HDMI),
# which has no PCM at device 0, so dmix fails with "unable to open slave".
defaults.pcm.card 1
defaults.ctl.card 1
