# PlayOS Intel installer kernel fragment (Sprint 13)
#
# Applied after board/intel/linux-fragment.cfg for the one-shot installer.
# Forces playos.mode=install on the kernel command line so playos-init
# spawns the trusted installer instead of the normal shell.
#
# CONFIG_CMDLINE_BOOL must be set, or the CONFIG_CMDLINE value is dropped
# when the kernel is built with the EFI stub (CONFIG_CMDLINE is ignored
# unless CONFIG_CMDLINE_BOOL=y).

CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE="console=tty1 quiet loglevel=3 playos.mode=install reboot=force"
