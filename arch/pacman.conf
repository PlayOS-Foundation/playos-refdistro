#
# /etc/pacman.conf — PlayOS Arch (pinned repos)
#
# Pinned to archive.archlinux.org snapshots for reproducibility.
# CachyOS repos for optimized kernel and znver4 packages.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# === Pinned Arch repositories ===
# Snapshot: 2026-07-01 — update deliberately after validation

[core]
Server = https://archive.archlinux.org/repos/2026/07/01/core/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/07/01/extra/os/$arch

# === CachyOS repositories ===
# GPG key: F3B607488DB35A47
# Single mirror for reproducibility

[cachyos]
SigLevel = Optional
Server = https://mirror.cachyos.org/repo/x86_64/$repo

[cachyos-znver4]
SigLevel = Optional
Server = https://mirror.cachyos.org/repo/x86_64_v4/$repo
