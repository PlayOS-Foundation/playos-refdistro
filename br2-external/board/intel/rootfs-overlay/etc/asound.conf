# PlayOS ALSA routing — internal codec on Intel HDA platforms.
#
# On Intel PC / ZenBook targets the internal codec (HDA Intel PCH, e.g.
# ALC295 Analog) is card 0; the GPU's HDMI/DP audio are devices 3/7/8 on the
# same card. Explicit so it stays symmetric with the Ally board file.
defaults.pcm.card 0
defaults.ctl.card 0
